<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<title>Produtos</title>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            NovaStore
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                Produtos
            </a>

            <a href="/carrinho" class="btn btn-outline-warning me-2">
                Carrinho
            </a>

            <a href="/meus-pedidos" class="btn btn-outline-info me-2">
                Pedidos
            </a>

            <a href="/auth/logout" class="btn btn-danger">
                Sair
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

<h1>Novo Produto</h1>

<form
action="/produtos/novo"
method="POST"
enctype="multipart/form-data">

<input
class="form-control mb-3"
name="nome"
placeholder="Nome">

<textarea
class="form-control mb-3"
name="descricao"
placeholder="Descrição"></textarea>

<input
class="form-control mb-3"
name="preco"
type="number"
step="0.01"
placeholder="Preço">

<input
class="form-control mb-3"
name="estoque"
type="number"
placeholder="Estoque">

<input
class="form-control mb-3"
name="categoria_id"
type="number"
placeholder="Categoria">

<input
class="form-control mb-3"
name="imagem"
type="file">

<button
class="btn btn-success">
Cadastrar
</button>

</form>

</div>

</body>
</html>
